<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Turnaround Estimator</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Internal tool</p>
          <h1>Turnaround Estimator</h1>
        </div>
        <p class="header-note">Estimate production, handoff and delivery dates from five fast inputs.</p>
      </header>

      <section class="tool-layout" aria-label="Turnaround estimate controls and result">
        <form id="estimate-form" class="controls">
          <div class="field" data-form-row="1">
            <label for="domain">Domain</label>
            <select id="domain" name="domain"></select>
          </div>

          <div class="field" data-form-row="1">
            <label for="order-date">Order date</label>
            <input id="order-date" name="order-date" type="date" required>
          </div>

          <div class="field production-days-field" data-form-row="2">
            <label for="production-days">Production days</label>
            <div class="production-days-control">
              <div class="production-quick-group" aria-label="Common production day values">
                <button type="button" class="production-quick" data-production-days="1" aria-pressed="true">1</button>
                <button type="button" class="production-quick" data-production-days="2" aria-pressed="false">2</button>
                <button type="button" class="production-quick" data-production-days="3" aria-pressed="false">3</button>
                <button type="button" class="production-quick" data-production-days="4" aria-pressed="false">4</button>
                <button type="button" class="production-quick" data-production-days="5" aria-pressed="false">5</button>
              </div>
              <input id="production-days" name="production-days" type="number" min="1" max="20" step="1" inputmode="numeric" value="1" required aria-describedby="production-days-error">
            </div>
            <p id="production-days-error" class="field-error" hidden></p>
          </div>

          <div class="field" data-form-row="2">
            <label for="shipping-method">Shipping method</label>
            <select id="shipping-method" name="shipping-method"></select>
          </div>

          <div class="field" data-form-row="3">
            <label for="shipment-timing">Shipment timing</label>
            <select id="shipment-timing" name="shipment-timing"></select>
          </div>
        </form>

        <section class="result-panel" aria-labelledby="result-heading" aria-live="polite">
          <div class="result-main">
            <p class="eyebrow">Expected delivery</p>
            <div id="copy-formats" class="result-estimates" aria-label="Copy delivery estimate formats">
              <div class="result-estimate-row result-estimate-row-main">
                <h2 id="result-heading">Enter order details</h2>
                <button type="button" class="copy-button result-copy-button" data-copy-target="result-heading" aria-label="Copy written-out delivery estimate">Copy</button>
              </div>
              <div id="numeric-estimate-row" class="result-estimate-row result-estimate-row-numeric" hidden>
                <span id="copy-numeric" class="numeric-estimate"></span>
                <button type="button" class="copy-button result-copy-button" data-copy-target="copy-numeric" aria-label="Copy numeric delivery estimate">Copy</button>
              </div>
            </div>
            <p id="result-detail" class="result-detail" hidden></p>
            <p id="config-note" class="config-note" hidden></p>
          </div>
        </section>
      </section>

      <section class="legend" aria-label="Calendar legend">
        <span class="legend-item legend-order">Order placed</span>
        <span class="legend-item legend-production">Production</span>
        <span class="legend-item legend-pickup">Pick-Up Day</span>
        <span class="legend-item legend-transit">Transit</span>
        <span class="legend-item legend-delivery">Expected delivery</span>
      </section>

      <section id="calendar" class="calendar-region" aria-label="Projection calendar"></section>
    </main>

    <script src="src/date-utils.js"></script>
    <script src="src/us-holidays.js"></script>
    <script src="src/estimator.js"></script>
    <script src="src/domain-config.js"></script>
    <script src="src/calendar.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
